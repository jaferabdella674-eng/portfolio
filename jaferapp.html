<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jafer App</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f0f2f5;
}

/* HEADER */
header {
  background: #1877f2;
  color: white;
  padding: 15px;
  text-align: center;
}

/* CONTAINER */
.container {
  display: flex;
  gap: 20px;
  padding: 20px;
}

/* LEFT = POSTS */
.posts {
  width: 50%;
}

.post-box {
  background: white;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 10px;
}

.post-box textarea {
  width: 100%;
  height: 60px;
}

.post-box button {
  margin-top: 5px;
}

/* RIGHT = CHAT */
.chat {
  width: 50%;
  background: white;
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  margin-bottom: 10px;
}

.message {
  margin: 5px 0;
}

.user {
  text-align: right;
  color: blue;
}

.bot {
  text-align: left;
  color: green;
}
</style>

</head>

<body>

<header>
  <h2>Jafer Social + Chat App</h2>
</header>

<div class="container">

  <!-- POSTS -->
  <div class="posts">
    <div class="post-box">
      <textarea id="postInput" placeholder="Write a post..."></textarea>
      <button onclick="addPost()">Post</button>
    </div>

    <div id="postList"></div>
  </div>

  <!-- CHAT -->
  <div class="chat">
    <div class="chat-box" id="chatBox"></div>

    <input type="text" id="chatInput" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>
function addPost() {
  let input = document.getElementById("postInput");
  let postList = document.getElementById("postList");

  let newPost = document.createElement("div");
  newPost.className = "post-box";
  newPost.innerText = input.value;

  postList.prepend(newPost);
  input.value = "";
}

function sendMessage() {
  let input = document.getElementById("chatInput");
  let chatBox = document.getElementById("chatBox");

  let userMsg = document.createElement("div");
  userMsg.className = "message user";
  userMsg.innerText = "You: " + input.value;

  chatBox.appendChild(userMsg);

  let botMsg = document.createElement("div");
  botMsg.className = "message bot";
  botMsg.innerText = "Bot: Hello Jafer! 😊";

  chatBox.appendChild(botMsg);

  input.value = "";
  function format(time) {
  return time < 10 ? "0" + time : time;
}
clock.innerHTML =
  format(hours) + ":" +
  format(minutes) + ":" +
  format(seconds);
}
</script>

</body>
</html>
