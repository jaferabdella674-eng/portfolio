<!DOCTYPE html>
<html>

<head>
  <title>My Website</title>

  <style>
    body {
      background-color: #f0f8ff;
      font-family: Arial, sans-serif;
      color: #333;
      text-align: center;
    }

    .navbar {
      background-color: #004080;
      padding: 10px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 16px;
    }

    .navbar a:hover {
      color: lightblue;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .box {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      width: 250px;
    }

    button {
      padding: 10px 20px;
      background-color: blue;
      color: white;
      border-radius: 5px;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: darkblue;
    }

    @media screen and (max-width: 600px) {
      .container {
        flex-direction: column;
        gap: 10px;
      }

      .navbar a {
        display: block;
        margin: 5px 0;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#contact">Contact</a>
  </nav>

  <div class="container">
    <div class="box">
      <h1>Welcome</h1>
      <p>My name is Jafer</p>
      <button>Contact Me</button>
    </div>

    <div class="box">
      <h2>My Skills</h2>
      <p>HTML, CSS, JavaScript</p>
    </div>
  </div>

</body>

</html>
