<!DOCTYPE html>
<html>
<head>
  <title>HTML CSS JS Practice</title>

  <!-- CSS -->
  <style>
    body {
      font-family: Arial;
      background-color: #f2f2f2;
      padding: 20px;
    }

    /* BOX (DIV) */
    .box {
      width: 300px;
      padding: 30px;
      background-color: white;
      border: 2px solid blue;
      margin-bottom: 30px;
    }

    /* BUTTON */
    button {
      background-color: blue;
      color: white;
      padding: 20px 30px;
      border: none;
      cursor: pointer;
      font-size: 24px;
    }

    /* HOVER EFFECT */
    button:hover {
      background-color: green;
    }
  </style>
</head>

<body>

  <h1>Jira Jirtuu Jafer,WELCOME TO WORLD 👋</h1>

  <!-- BOX -->
  <div class="box">
    <p>Kuni BOX (div) practice ti</p>
  </div>

  <!-- BUTTON -->
  <button onclick="message()">Click Me</button>

  <!-- JAVASCRIPT -->
  <script>
    function message() {
      alert("Button cuqaaste! JavaScript hojjetaa jira 👍");
    }
  </script>

</body>
</html>
