<!DOCTYPE html>
<html>
<head>
  <title>JAFER A Web</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f0f8ff;
    }

    input, button {
      padding: 10px;
      margin: 5px;
      font-size: 16px;
    }

    #result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #004080;
    }
  </style>
</head>
<body>

  <h1>JAFEE</h1>

  <h3>1. Button Alert</h3>
  <button onclick="alert('Practice Alert!')">Click Me</button>

  <hr>

  <h3>2. Text Change</h3>
  <p id="text">Original Text</p>
  <button onclick="document.getElementById('text').innerHTML = 'Text Changed!'">Change</button>

  <hr>

  <h3>3. Input Name & Show Message</h3>
  <input type="text" id="name" placeholder="Enter your name">
  <button onclick="JAFAR ()">Say JAFEE👌🐄</button>

  <p id="result"></p>

  <script>
    function greetUser() {
      let user = document.getElementById("name").value;
      document.getElementById("result").innerHTML = "Hello " + user + " 👋";
    }
  </script>

</body>
</html>
